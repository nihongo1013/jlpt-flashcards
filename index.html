<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Lingua Pairs · Dictionary Language Flashcards</title>
  <meta name="description" content="Lingua Pairs: offline two-language flashcards with 109 languages and a Japanese JLPT deck.">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/redesign.css">
</head>
<body>
<header>
  <div class="header-top">
    <div class="brand">
      <div class="brand-name">Lingua Pairs</div>
    </div>
  </div>

  <div class="search-bar" role="search">
    <input type="text" id="q" placeholder="Search words, readings, senses, categories" aria-label="Search cards" autocomplete="off">
    <div class="header-btns">
      <button type="button" class="icon-btn" id="autoplayBtn" title="Auto-play" aria-label="Auto-play" onclick="toggleAutoplay()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
      </button>
      <button type="button" class="icon-btn" id="fsBtn" title="Fullscreen" aria-label="Fullscreen" onclick="toggleFullscreen()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" fill="currentColor"/></svg>
      </button>
      <button type="button" class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings" onclick="toggleSettingsDialog()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19.14 12.94C19.18 12.64 19.2 12.33 19.2 12C19.2 11.68 19.18 11.36 19.13 11.06L21.16 9.48C21.34 9.34 21.39 9.07 21.28 8.87L19.36 5.55C19.24 5.33 18.99 5.26 18.77 5.33L16.38 6.29C15.88 5.91 15.35 5.59 14.76 5.35L14.4 2.81C14.36 2.57 14.16 2.4 13.92 2.4H10.08C9.84 2.4 9.65 2.57 9.61 2.81L9.25 5.35C8.66 5.59 8.12 5.92 7.63 6.29L5.24 5.33C5.02 5.25 4.77 5.33 4.65 5.55L2.74 8.87C2.62 9.08 2.66 9.34 2.86 9.48L4.89 11.06C4.84 11.36 4.8 11.69 4.8 12C4.8 12.31 4.82 12.64 4.87 12.94L2.85 14.52C2.67 14.66 2.62 14.93 2.73 15.13L4.65 18.45C4.77 18.67 5.02 18.74 5.24 18.67L7.63 17.71C8.13 18.09 8.66 18.41 9.25 18.65L9.61 21.19C9.65 21.43 9.84 21.6 10.08 21.6H13.92C14.16 21.6 14.36 21.43 14.39 21.19L14.75 18.65C15.34 18.41 15.88 18.09 16.37 17.71L18.76 18.67C18.98 18.75 19.23 18.67 19.35 18.45L21.27 15.13C21.39 14.91 21.34 14.66 21.15 14.52L19.14 12.94ZM12 15.6C10.02 15.6 8.4 13.98 8.4 12C8.4 10.02 10.02 8.4 12 15.6 13.98 15.6 15.6 13.98 15.6 12C15.6 10.02 13.98 8.4 12 8.4C10.02 8.4 8.4 10.02 8.4 12Z" fill="currentColor"/></svg>
      </button>
    </div>
  </div>

  <div class="pair-bar">
    <div class="control-field deck-mode-field">
      <select id="deckMode" aria-label="Deck">
        <option value="dictionary" selected>Dictionary pairs</option>
        <option value="jlpt">JLPT Japanese</option>
      </select>
    </div>

    <div class="pair-fields" id="pairFields">
      <div class="control-field">
        <select id="sourceLang" aria-label="Language 1"><option value="ja">Loading languages</option></select>
      </div>
      <button type="button" class="swap-btn" id="swapLangs" title="Swap languages" aria-label="Swap languages">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 7h11l-3-3m3 3-3 3M17 17H6l3 3m-3-3 3-3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="control-field">
        <select id="targetLang" aria-label="Language 2"><option value="en">Loading languages</option></select>
      </div>
    </div>

    <div class="control-field hidden" id="jlptLangField">
      <select id="langSelect" aria-label="Meaning language">
        <option value="en" selected>English (EN)</option>
        <option value="hi">हिंदी (HI)</option>
      </select>
    </div>
  </div>

  <div id="status" aria-live="polite"></div>
</header>

<div class="settings-dialog" id="settingsDialog" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" tabindex="-1">
  <div class="settings-content">
    <div class="settings-header">
      <h2 id="settingsTitle">Settings</h2>
      <button type="button" class="settings-close" onclick="toggleSettingsDialog()" title="Close settings" aria-label="Close settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="settings-body">
      <div class="settings-section hidden" id="levelSection">
        <label for="lv">Level</label>
        <select id="lv">
          <option value="n5">N5 (Beginner)</option>
          <option value="n4">N4 (Elementary)</option>
          <option value="n3">N3 (Intermediate)</option>
          <option value="n2">N2 (Upper-Intermediate)</option>
          <option value="n1">N1 (Advanced)</option>
          <option value="n5+n4">N5 + N4</option>
          <option value="n5+n4+n3">N5 + N4 + N3</option>
          <option value="n5+n4+n3+n2">N5 + N4 + N3 + N2</option>
          <option value="n5+n4+n3+n2+n1" selected>All Levels</option>
        </select>
      </div>
      <div class="settings-section">
        <label for="cat" id="catLabel">Category</label>
        <select id="cat"><option value="">All categories</option></select>
      </div>
      <div class="settings-section">
        <label for="frontVoice" id="frontVoiceLabel">Voice 1</label>
        <select id="frontVoice" title="Voice 1"><option value="">Browser default</option></select>
      </div>
      <div class="settings-section">
        <label for="backVoice" id="backVoiceLabel">Voice 2</label>
        <select id="backVoice" title="Voice 2"><option value="">Browser default</option></select>
      </div>
      <p class="voice-notice hidden" id="voiceNotice"></p>
      <div class="settings-section checkbox-section">
        <label class="checkbox-row">
          <input type="checkbox" id="showContext" checked>
          <span>Show context</span>
        </label>
      </div>
      <div class="settings-section">
        <button type="button" id="shuf" class="settings-toggle" title="Shuffle cards">
          <span class="toggle-label">Shuffle</span>
          <span class="toggle-status">OFF</span>
        </button>
      </div>
      <div class="settings-section settings-note">
        <a href="data/dictionary/ATTRIBUTION.md" target="_blank" rel="noopener noreferrer">Sources &amp; licence</a>
      </div>
    </div>
  </div>
</div>

<main id="list"></main>
<noscript><div class="empty">This flashcard app needs JavaScript enabled.</div></noscript>

<div class="fullscreen-overlay" id="fsOverlay">
  <button type="button" class="fs-close" onclick="closeFullscreen()" title="Close fullscreen" aria-label="Close fullscreen">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <div class="fs-stage" id="fsCard"></div>
  <div class="fs-nav">
    <button type="button" class="fs-nav-btn" onclick="fsPrev()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" fill="currentColor"/></svg>
      <span>Prev</span>
    </button>
    <span class="fs-counter" id="fsCounter" aria-live="polite">1 / 1</span>
    <button type="button" class="fs-nav-btn" onclick="fsNext()">
      <span>Next</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z" fill="currentColor"/></svg>
    </button>
  </div>
</div>

<div class="autoplay-bar" id="autoplayBar">
  <button type="button" onclick="stopAutoplay()" title="Stop" aria-label="Stop" class="ap-btn">
    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" fill="currentColor"/></svg>
  </button>
  <button type="button" onclick="prevCard()" title="Previous" aria-label="Previous" class="ap-btn">
    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" fill="currentColor"/></svg>
  </button>
  <button type="button" onclick="nextCard()" title="Next" aria-label="Next" class="ap-btn">
    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z" fill="currentColor"/></svg>
  </button>
  <span id="autoplayStatus"></span>
  <div class="progress" role="progressbar" aria-label="Autoplay progress"><div class="progress-fill" id="progressFill"></div></div>
</div>

<script src="data/vocabulary.js"></script>
<script src="data/dictionary/meta.js"></script>
<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/dictionary.js"></script>
<script src="js/data.js"></script>
<script src="js/speech.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
